services:
  - type: web
    name: smart-dine-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: postgresql://smart_dine_user:La7vbSBZo0l0UFKk1NsfcoQCONjmEfQI@dpg-dbhngd7f3r2c73dc0p50-a/smart_dine
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smart-dine-1zev.onrender.com
      - key: FRONTEND_PUBLIC_URL
        value: https://smart-dine-1zev.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: DEBUG
        value: false

  - type: web
    name: smart-dine-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-dine-ss74.onrender.com

databases:
  - name: smart-dine-db
    databaseName: smartdine
    user: smartdine
