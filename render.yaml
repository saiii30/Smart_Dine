services:
  - type: web
    name: smart-dine-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-dine-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smart-dine-frontend.onrender.com
      - key: FRONTEND_PUBLIC_URL
        value: https://smart-dine-frontend.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480

  - type: web
    name: smart-dine-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/build
    envVars:
      - key: VITE_API_URL
        value: https://smart-dine-backend.onrender.com

databases:
  - name: smart-dine-db
    databaseName: smartdine
    user: smartdine
